# This workflow builds the project and creates a release with JAR files

name: Build and Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle
      run: chmod +x ./gradlew && ./gradlew build

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: Rainbow-1.0.0.jar
        path: build/libs/Rainbow-1.0.0.jar

    - name: Upload Sources JAR
      uses: actions/upload-artifact@v4
      with:
        name: Rainbow-1.0.0-sources.jar
        path: build/libs/Rainbow-1.0.0-sources.jar

    - name: Upload Javadoc JAR
      uses: actions/upload-artifact@v4
      with:
        name: Rainbow-1.0.0-javadoc.jar
        path: build/libs/Rainbow-1.0.0-javadoc.jar
